<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Lead Form</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="container">

        <h1>AI Lead Form</h1>

        <p class="subtitle">
            Submit your enquiry
        </p>

        <form id="leadForm">

            <div class="form-group">

                <label>Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Phone</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                    required
                >

            </div>


            <div class="form-group">

                <label>City</label>

                <input
                    type="text"
                    id="city"
                    placeholder="Enter your city"
                    required
                >

            </div>


            <div class="form-group">

                <label>Interested In</label>

                <input
                    type="text"
                    id="interest"
                    placeholder="Example: Python Course"
                    required
                >

            </div>


            <div class="form-group">

                <label>Message</label>

                <textarea
                    id="message"
                    placeholder="Tell us about your requirement"
                    required
                ></textarea>

            </div>


            <button type="submit">

                Submit Enquiry

            </button>

        </form>


        <div
            id="result"
            class="result"
        ></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
